services:
  zerotier:
    image: zyclonite/zerotier:latest
    container_name: zerotier
    restart: unless-stopped
    network_mode: host          # necessário para criar interface virtual no host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - zerotier_data:/var/lib/zerotier-one
    environment:
      NETWORK_ID: ${ZEROTIER_NETWORK_ID}

  cs16:
    build: .
    container_name: cs16-server
    restart: unless-stopped
    ports:
      - "27015:27015/udp"
    volumes:
      - cs16_data:/home/steam/hlds
    env_file: .env
    depends_on:
      - zerotier

  panel:
    build: ./panel
    container_name: cs16-panel
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # only localhost; remove 127.0.0.1: to expose publicly
    environment:
      CS_HOST: cs16
      CS_PORT: 27015
    env_file: .env
    depends_on:
      - cs16

volumes:
  cs16_data:
  zerotier_data:
