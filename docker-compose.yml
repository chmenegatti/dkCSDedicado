services:
  zerotier:
    image: zyclonite/zerotier:latest
    container_name: zerotier
    restart: unless-stopped
    network_mode: host          # necessário para criar interface virtual no host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - zerotier_data:/var/lib/zerotier-one

  zt-auth:
    build: ./zt-auth
    container_name: zt-auth
    restart: unless-stopped
    network_mode: host          # acessa a API local do controller em localhost:9993
    volumes:
      - zerotier_data:/var/lib/zerotier-one:ro  # leitura do token e identity
    environment:
      POLL_INTERVAL: ${POLL_INTERVAL:-15}
    depends_on:
      - zerotier

  cs16:
    build: .
    container_name: cs16-server
    restart: unless-stopped
    ports:
      - "27015:27015/udp"
    volumes:
      - cs16_data:/home/steam/hlds
    env_file: .env
    security_opt:
      - seccomp:unconfined   # HLDS é 32-bit e usa socketcall(); o seccomp padrão pode bloqueá-lo
    depends_on:
      - zerotier

  panel:
    build: ./panel
    container_name: cs16-panel
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # only localhost; remove 127.0.0.1: to expose publicly
    environment:
      CS_HOST: cs16
      CS_PORT: 27015
      HLDS_DIR: /srv/hlds
    env_file: .env
    volumes:
      - cs16_data:/srv/hlds
    depends_on:
      - cs16

  frontend:
    build: ./front-end
    container_name: cs16-frontend
    restart: unless-stopped
    ports:
      - "3000:80"   # acessível na rede local (sem 127.0.0.1:)
    depends_on:
      - panel

volumes:
  cs16_data:
  zerotier_data:

